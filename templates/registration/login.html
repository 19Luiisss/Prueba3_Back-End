{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-lg border-0 rounded-1 bg-white">
      
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h3 class="fw-bold tracking-tight mb-0">SportVault</h3>
        </div>

        {% if form.errors %}
          <div class="alert alert-danger border-0 rounded-1 text-center py-2 small">
            Credenciales incorrectas
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          
          <div class="mb-3">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem;">Usuario</label>
            <input type="text" name="username" class="form-control bg-light border-0 rounded-1 py-2" required>
          </div>
          
          <div class="mb-4">
            <label class="form-label fw-bold text-muted small text-uppercase" style="font-size: 0.75rem;">Contraseña</label>
            <input type="password" name="password" class="form-control bg-light border-0 rounded-1 py-2" required>
          </div>

          <button type="submit" class="btn btn-dark w-100 py-2 rounded-1 fw-bold">Ingresar</button>
        </form>
        
      </div>
    </div>
  </div>
</div>
{% endblock %}
