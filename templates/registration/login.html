{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-dark text-white text-center py-3">
        <h4 class="mb-0">Ingreso a SportVault</h4>
      </div>
      <div class="card-body p-4">
        
        {% if form.errors %}
          <div class="alert alert-danger">
            Tu usuario y contraseña no coinciden. Por favor, inténtalo de nuevo.
          </div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="id_username" class="form-label fw-bold">Usuario</label>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control">
          </div>
          
          <div class="mb-4">
            <label for="id_password" class="form-label fw-bold">Contraseña</label>
            <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control">
          </div>

          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
          </div>
        </form>
        
      </div>
    </div>
  </div>
</div>
{% endblock %}
