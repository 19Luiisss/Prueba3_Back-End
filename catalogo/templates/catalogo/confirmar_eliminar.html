{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5 text-center">
        
        <div class="mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-exclamation-circle text-warning" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
            <path d="M7.002 11a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 4.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 4.995z"/>
          </svg>
        </div>

        <h4 class="mb-3 fw-bold">Eliminar artículo</h4>
        <p class="text-muted mb-4">¿Estás seguro de que deseas eliminar este artículo? Esta acción no se puede deshacer.</p>
        
        <div class="bg-light p-3 rounded mb-4 fw-bold text-dark border">
          {{ object.nombre }}
        </div>
        
        <form method="post">
          {% csrf_token %}
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista' %}" class="btn btn-light border">Cancelar</a>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>
{% endblock %}
